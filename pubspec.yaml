name: joruri_messenger
description: Offline emergency messenger using local device-to-device communication.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Local database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Bluetooth
  flutter_blue_plus: ^2.0.0

  # Wi-Fi / local network
  network_info_plus: ^7.0.0

  # Unique device/app identification
  uuid: ^4.5.1

  # Internet/API communication later
  http: ^1.6.0

  # App permissions
  permission_handler: ^12.0.1

  # State management
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
