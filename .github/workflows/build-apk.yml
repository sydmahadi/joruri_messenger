name: Build Joruri Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          rm -rf android
          flutter create . \
            --platforms=android \
            --org com.joruri \
            --project-name joruri_messenger

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permissions = """
              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADVERTISE" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.INTERNET" />
          """

          if "android.permission.BLUETOOTH_SCAN" not in text:
              text = text.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          text = text.replace(
              'android:label="joruri_messenger"',
              'android:label="জরুরি মেসেঞ্জার"',
              1
          )

          path.write_text(text)
          PY

      - name: Create native Bluetooth MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/joruri/joruri_messenger

          cat > android/app/src/main/kotlin/com/joruri/joruri_messenger/MainActivity.kt <<'EOF'
          package com.joruri.joruri_messenger

          import android.Manifest
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothGatt
          import android.bluetooth.BluetoothGattCharacteristic
          import android.bluetooth.BluetoothGattDescriptor
          import android.bluetooth.BluetoothGattServer
          import android.bluetooth.BluetoothGattServerCallback
          import android.bluetooth.BluetoothGattService
          import android.bluetooth.BluetoothManager
          import android.bluetooth.BluetoothProfile
          import android.bluetooth.BluetoothStatusCodes
          import android.bluetooth.le.AdvertiseCallback
          import android.bluetooth.le.AdvertiseData
          import android.bluetooth.le.AdvertiseSettings
          import android.bluetooth.le.BluetoothLeAdvertiser
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.ParcelUuid
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import org.json.JSONObject
          import java.util.UUID
          import java.util.concurrent.ConcurrentHashMap

          class MainActivity : FlutterActivity() {

              companion object {
                  private const val CHANNEL =
                      "joruri_messenger/bluetooth"

                  private val SERVICE_UUID = UUID.fromString(
                      "0000FEE0-0000-1000-8000-00805F9B34FB"
                  )

                  private val CHARACTERISTIC_UUID = UUID.fromString(
                      "0000FEE1-0000-1000-8000-00805F9B34FB"
                  )

                  private val CCCD_UUID = UUID.fromString(
                      "00002902-0000-1000-8000-00805F9B34FB"
                  )
              }

              private lateinit var channel: MethodChannel
              private var gattServer: BluetoothGattServer? = null
              private var advertiser: BluetoothLeAdvertiser? = null
              private var characteristic: BluetoothGattCharacteristic? = null

              @Volatile
              private var serviceReady = false

              @Volatile
              private var advertising = false

              private val connectedDevices =
                  ConcurrentHashMap<String, BluetoothDevice>()

              private val requesterAddresses =
                  ConcurrentHashMap<String, String>()

              private val notificationsEnabled =
                  ConcurrentHashMap<String, Boolean>()

              private val approvedAddresses =
                  ConcurrentHashMap<String, Boolean>()

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  channel = MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  )

                  channel.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startAdvertising" -> {
                              try {
                                  startBluetoothServer()
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error(
                                      "BLE_START_FAILED",
                                      e.message ?: "Unable to start BLE",
                                      null
                                  )
                              }
                          }

                          "stopAdvertising" -> {
                              stopBluetoothAdvertisingOnly()
                              result.success(true)
                          }

                          "sendMessage" -> {
                              val message =
                                  call.argument<String>("message")

                              val requesterId =
                                  call.argument<String>("requesterId")

                              if (message.isNullOrEmpty()) {
                                  result.error(
                                      "INVALID_MESSAGE",
                                      "Message is empty",
                                      null
                                  )
                              } else {
                                  result.success(
                                      sendMessage(message, requesterId)
                                  )
                              }
                          }

                          "getBluetoothState" -> {
                              result.success(isBluetoothEnabled())
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              private fun hasPermission(permission: String): Boolean {
                  return Build.VERSION.SDK_INT < 23 ||
                      checkSelfPermission(permission) ==
                      PackageManager.PERMISSION_GRANTED
              }

              private fun hasConnectPermission(): Boolean =
                  Build.VERSION.SDK_INT < Build.VERSION_CODES.S ||
                      hasPermission(Manifest.permission.BLUETOOTH_CONNECT)

              private fun hasAdvertisePermission(): Boolean =
                  Build.VERSION.SDK_INT < Build.VERSION_CODES.S ||
                      hasPermission(Manifest.permission.BLUETOOTH_ADVERTISE)

              private fun isBluetoothEnabled(): Boolean {
                  if (!hasConnectPermission()) return false

                  return try {
                      val manager = getSystemService(
                          Context.BLUETOOTH_SERVICE
                      ) as BluetoothManager

                      manager.adapter?.isEnabled == true
                  } catch (_: Exception) {
                      false
                  }
              }

              @Synchronized
              private fun startBluetoothServer() {
                  if (!hasConnectPermission() ||
                      !hasAdvertisePermission()
                  ) {
                      throw SecurityException(
                          "Bluetooth permission is required"
                      )
                  }

                  val manager = getSystemService(
                      Context.BLUETOOTH_SERVICE
                  ) as BluetoothManager

                  val adapter = manager.adapter
                      ?: throw IllegalStateException(
                          "Bluetooth unavailable"
                      )

                  if (!adapter.isEnabled) {
                      throw IllegalStateException(
                          "প্রথমে ফোনের Bluetooth চালু করুন"
                      )
                  }

                  /*
                   * গুরুত্বপূর্ণ:
                   * সার্ভার আগে থেকেই চালু থাকলে পুনরায় চালু করবে না।
                   * এতে আগের GATT সংযোগগুলো অকারণে বিচ্ছিন্ন হবে না।
                   */
                  if (gattServer != null && advertiser != null) {
                      if (serviceReady && !advertising) {
                          startAdvertisingAfterServiceAdded()
                      }
                      return
                  }

                  val bleAdvertiser = adapter.bluetoothLeAdvertiser
                      ?: throw IllegalStateException(
                          "এই ফোনে BLE advertising সমর্থিত নয়"
                      )

                  stopBluetoothServer()

                  val newCharacteristic = BluetoothGattCharacteristic(
                      CHARACTERISTIC_UUID,
                      BluetoothGattCharacteristic.PROPERTY_READ or
                          BluetoothGattCharacteristic.PROPERTY_WRITE or
                          BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE or
                          BluetoothGattCharacteristic.PROPERTY_NOTIFY,
                      BluetoothGattCharacteristic.PERMISSION_READ or
                          BluetoothGattCharacteristic.PERMISSION_WRITE
                  )

                  newCharacteristic.addDescriptor(
                      BluetoothGattDescriptor(
                          CCCD_UUID,
                          BluetoothGattDescriptor.PERMISSION_READ or
                              BluetoothGattDescriptor.PERMISSION_WRITE
                      )
                  )

                  val service = BluetoothGattService(
                      SERVICE_UUID,
                      BluetoothGattService.SERVICE_TYPE_PRIMARY
                  )

                  service.addCharacteristic(newCharacteristic)

                  characteristic = newCharacteristic
                  advertiser = bleAdvertiser
                  serviceReady = false
                  advertising = false

                  gattServer = manager.openGattServer(
                      this,
                      gattCallback
                  ) ?: throw IllegalStateException(
                      "GATT server চালু করা যায়নি"
                  )

                  if (gattServer?.addService(service) != true) {
                      stopBluetoothServer()

                      throw IllegalStateException(
                          "Bluetooth service যোগ করা যায়নি"
                      )
                  }
              }

              @Synchronized
              private fun startAdvertisingAfterServiceAdded() {
                  if (advertising || !serviceReady) return

                  val bleAdvertiser = advertiser ?: return

                  try {
                      val settings = AdvertiseSettings.Builder()
                          .setAdvertiseMode(
                              AdvertiseSettings.ADVERTISE_MODE_LOW_LATENCY
                          )
                          .setTxPowerLevel(
                              AdvertiseSettings.ADVERTISE_TX_POWER_MEDIUM
                          )
                          .setConnectable(true)
                          .setTimeout(0)
                          .build()

                      val data = AdvertiseData.Builder()
                          .setIncludeDeviceName(false)
                          .addServiceUuid(ParcelUuid(SERVICE_UUID))
                          .build()

                      bleAdvertiser.startAdvertising(
                          settings,
                          data,
                          advertiseCallback
                      )
                  } catch (e: Exception) {
                      notifyFlutterError(
                          "Advertising error: ${e.message}"
                      )
                  }
              }

              private fun notifyFlutterError(message: String) {
                  runOnUiThread {
                      channel.invokeMethod("bluetoothError", message)
                  }
              }

              private val advertiseCallback =
                  object : AdvertiseCallback() {
                      override fun onStartSuccess(
                          settingsInEffect: AdvertiseSettings?
                      ) {
                          advertising = true

                          runOnUiThread {
                              channel.invokeMethod(
                                  "advertisingStarted",
                                  null
                              )
                          }
                      }

                      override fun onStartFailure(errorCode: Int) {
                          advertising = false

                          notifyFlutterError(
                              "Advertising failed: $errorCode"
                          )
                      }
                  }

              private val gattCallback =
                  object : BluetoothGattServerCallback() {

                      override fun onServiceAdded(
                          status: Int,
                          service: BluetoothGattService
                      ) {
                          if (service.uuid != SERVICE_UUID) return

                          if (status == BluetoothGatt.GATT_SUCCESS) {
                              serviceReady = true
                              startAdvertisingAfterServiceAdded()
                          } else {
                              notifyFlutterError(
                                  "GATT service add failed: $status"
                              )
                          }
                      }

                      override fun onConnectionStateChange(
                          device: BluetoothDevice,
                          status: Int,
                          newState: Int
                      ) {
                          val address = device.address

                          if (newState ==
                              BluetoothProfile.STATE_CONNECTED
                          ) {
                              connectedDevices[address] = device
                              approvedAddresses.putIfAbsent(address, false)

                              runOnUiThread {
                                  channel.invokeMethod(
                                      "deviceConnected",
                                      address
                                  )
                              }
                          } else if (newState ==
                              BluetoothProfile.STATE_DISCONNECTED
                          ) {
                              connectedDevices.remove(address)
                              notificationsEnabled.remove(address)
                              approvedAddresses.remove(address)

                              requesterAddresses.entries.removeIf {
                                  it.value == address
                              }

                              runOnUiThread {
                                  channel.invokeMethod(
                                      "deviceDisconnected",
                                      address
                                  )
                              }
                          }
                      }

                      override fun onCharacteristicReadRequest(
                          device: BluetoothDevice,
                          requestId: Int,
                          offset: Int,
                          characteristic: BluetoothGattCharacteristic
                      ) {
                          val value =
                              characteristic.value ?: byteArrayOf()

                          gattServer?.sendResponse(
                              device,
                              requestId,
                              BluetoothGatt.GATT_SUCCESS,
                              offset,
                              value
                          )
                      }

                      override fun onCharacteristicWriteRequest(
                          device: BluetoothDevice,
                          requestId: Int,
                          characteristic: BluetoothGattCharacteristic,
                          preparedWrite: Boolean,
                          responseNeeded: Boolean,
                          offset: Int,
                          value: ByteArray
                      ) {
                          if (characteristic.uuid != CHARACTERISTIC_UUID ||
                              offset != 0 || preparedWrite
                          ) {
                              if (responseNeeded) {
                                  gattServer?.sendResponse(
                                      device,
                                      requestId,
                                      BluetoothGatt.GATT_FAILURE,
                                      offset,
                                      null
                                  )
                              }
                              return
                          }

                          if (responseNeeded) {
                              gattServer?.sendResponse(
                                  device,
                                  requestId,
                                  BluetoothGatt.GATT_SUCCESS,
                                  offset,
                                  null
                              )
                          }

                          val message = value.toString(Charsets.UTF_8)

                          try {
                              val json = JSONObject(message)

                              if (json.optString("type") ==
                                  "connection_request"
                              ) {
                                  val senderId =
                                      json.optString("senderId")

                                  if (senderId.isNotEmpty()) {
                                      requesterAddresses[senderId] =
                                          device.address
                                  }
                              }
                          } catch (_: Exception) {
                              // সাধারণ বার্তা।
                          }

                          runOnUiThread {
                              channel.invokeMethod(
                                  "messageReceived",
                                  message
                              )
                          }
                      }

                      override fun onDescriptorReadRequest(
                          device: BluetoothDevice,
                          requestId: Int,
                          offset: Int,
                          descriptor: BluetoothGattDescriptor
                      ) {
                          gattServer?.sendResponse(
                              device,
                              requestId,
                              BluetoothGatt.GATT_SUCCESS,
                              offset,
                              descriptor.value ?: byteArrayOf(0, 0)
                          )
                      }

                      override fun onDescriptorWriteRequest(
                          device: BluetoothDevice,
                          requestId: Int,
                          descriptor: BluetoothGattDescriptor,
                          preparedWrite: Boolean,
                          responseNeeded: Boolean,
                          offset: Int,
                          value: ByteArray
                      ) {
                          if (descriptor.uuid == CCCD_UUID &&
                              offset == 0 &&
                              value.size >= 2
                          ) {
                              descriptor.value = value

                              val enabled =
                                  value[0].toInt() != 0

                              notificationsEnabled[device.address] =
                                  enabled

                              if (responseNeeded) {
                                  gattServer?.sendResponse(
                                      device,
                                      requestId,
                                      BluetoothGatt.GATT_SUCCESS,
                                      offset,
                                      value
                                  )
                              }
                          } else if (responseNeeded) {
                              gattServer?.sendResponse(
                                  device,
                                  requestId,
                                  BluetoothGatt.GATT_FAILURE,
                                  offset,
                                  null
                              )
                          }
                      }
                  }

              private fun sendMessage(
                  message: String,
                  requesterId: String? = null
              ): Boolean {
                  if (!hasConnectPermission()) return false

                  val server = gattServer ?: return false
                  val target = characteristic ?: return false
                  val payload = message.toByteArray(Charsets.UTF_8)

                  val targets = if (requesterId != null) {
                      val address = requesterAddresses[requesterId]
                      val device = address?.let {
                          connectedDevices[it]
                      }

                      if (device == null) {
                          emptyList()
                      } else {
                          listOf(device)
                      }
                  } else {
                      connectedDevices.values.filter { device ->
                          approvedAddresses[device.address] == true &&
                              notificationsEnabled[device.address] == true
                      }
                  }

                  if (targets.isEmpty()) return false

                  var successCount = 0

                  for (device in targets) {
                      try {
                          val result =
                              if (Build.VERSION.SDK_INT >=
                                  Build.VERSION_CODES.TIRAMISU
                              ) {
                                  server.notifyCharacteristicChanged(
                                      device,
                                      target,
                                      false,
                                      payload
                                  ) == BluetoothStatusCodes.SUCCESS
                              } else {
                                  target.value = payload

                                  @Suppress("DEPRECATION")
                                  server.notifyCharacteristicChanged(
                                      device,
                                      target,
                                      false
                                  )
                              }

                          if (result) {
                              successCount++

                              try {
                                  val json = JSONObject(message)

                                  when (json.optString("type")) {
                                      "connection_accepted" -> {
                                          approvedAddresses[device.address] = true
                                      }

                                      "connection_rejected" -> {
                                          approvedAddresses[device.address] = false
                                      }
                                  }
                              } catch (_: Exception) {
                                  // সাধারণ বার্তা।
                              }
                          }
                      } catch (_: Exception) {
                          // অন্য সংযুক্ত ডিভাইসগুলোতে পাঠানো চালিয়ে যাও।
                      }
                  }

                  return successCount > 0
              }

              private fun stopBluetoothAdvertisingOnly() {
                  try {
                      if (hasConnectPermission() &&
                          hasAdvertisePermission()
                      ) {
                          advertiser?.stopAdvertising(advertiseCallback)
                      }
                  } catch (_: Exception) {
                      // Ignore stop errors.
                  }

                  advertising = false
              }

              @Synchronized
              private fun stopBluetoothServer() {
                  stopBluetoothAdvertisingOnly()

                  try {
                      if (hasConnectPermission()) {
                          gattServer?.close()
                      }
                  } catch (_: Exception) {
                      // Ignore close errors.
                  }

                  advertiser = null
                  gattServer = null
                  characteristic = null
                  serviceReady = false

                  connectedDevices.clear()
                  requesterAddresses.clear()
                  notificationsEnabled.clear()
                  approvedAddresses.clear()
              }

              override fun onDestroy() {
                  stopBluetoothServer()
                  super.onDestroy()
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: joruri-messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
