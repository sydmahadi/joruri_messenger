name: Build Joruri Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Remove old Android project
        run: rm -rf android

      - name: Create fresh Android project
        run: |
          flutter create . \
            --platforms=android \
            --org com.joruri \
            --project-name joruri_messenger

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permissions = """
              <uses-feature
                  android:name="android.hardware.bluetooth_le"
                  android:required="false" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADVERTISE" />

              <uses-permission
                  android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />

              <uses-permission
                  android:name="android.permission.ACCESS_WIFI_STATE" />

              <uses-permission
                  android:name="android.permission.CHANGE_WIFI_STATE" />

              <uses-permission
                  android:name="android.permission.INTERNET" />
          """

          if "android.permission.BLUETOOTH_SCAN" not in text:
              text = text.replace(
                  "<application",
                  permissions + "\n    <application",
                  1
              )

          text = text.replace(
              'android:label="joruri_messenger"',
              'android:label="জরুরি মেসেঞ্জার"',
              1
          )

          manifest.write_text(text)
          PY

      - name: Create native Bluetooth MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/joruri/joruri_messenger

          cat > android/app/src/main/kotlin/com/joruri/joruri_messenger/MainActivity.kt <<'EOF'
          package com.joruri.joruri_messenger

          import android.Manifest
          import android.bluetooth.BluetoothDevice
          import android.bluetooth.BluetoothGatt
          import android.bluetooth.BluetoothGattCharacteristic
          import android.bluetooth.BluetoothGattDescriptor
          import android.bluetooth.BluetoothGattServer
          import android.bluetooth.BluetoothGattServerCallback
          import android.bluetooth.BluetoothGattService
          import android.bluetooth.BluetoothManager
          import android.bluetooth.BluetoothProfile
          import android.bluetooth.le.AdvertiseCallback
          import android.bluetooth.le.AdvertiseData
          import android.bluetooth.le.AdvertiseSettings
          import android.bluetooth.le.BluetoothLeAdvertiser
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.ParcelUuid
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.UUID

          class MainActivity : FlutterActivity() {

              companion object {
                  private const val CHANNEL =
                      "joruri_messenger/bluetooth"

                  private val SERVICE_UUID = UUID.fromString(
                      "0000FEE0-0000-1000-8000-00805F9B34FB"
                  )

                  private val CHARACTERISTIC_UUID = UUID.fromString(
                      "0000FEE1-0000-1000-8000-00805F9B34FB"
                  )

                  private val CCCD_UUID = UUID.fromString(
                      "00002902-0000-1000-8000-00805F9B34FB"
                  )
              }

              private lateinit var channel: MethodChannel

              private var gattServer: BluetoothGattServer? = null
              private var advertiser: BluetoothLeAdvertiser? = null
              private var connectedDevice: BluetoothDevice? = null
              private var characteristic: BluetoothGattCharacteristic? = null

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  channel = MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  )

                  channel.setMethodCallHandler { call, result ->
                      when (call.method) {
                          "startAdvertising" -> {
                              try {
                                  startBluetoothServer()
                                  result.success(true)
                              } catch (e: Exception) {
                                  result.error(
                                      "BLE_START_FAILED",
                                      e.message ?: "Unable to start BLE",
                                      null
                                  )
                              }
                          }

                          "stopAdvertising" -> {
                              stopBluetoothServer()
                              result.success(true)
                          }

                          "sendMessage" -> {
                              val message =
                                  call.argument<String>("message")

                              if (message.isNullOrEmpty()) {
                                  result.error(
                                      "INVALID_MESSAGE",
                                      "Message is empty",
                                      null
                                  )
                              } else {
                                  val sent = sendMessage(message)
                                  if (sent) {
                                      result.success(true)
                                  } else {
                                      result.error(
                                          "NO_CONNECTED_DEVICE",
                                          "No BLE client connected",
                                          null
                                      )
                                  }
                              }
                          }

                          "getBluetoothState" -> {
                              result.success(isBluetoothEnabled())
                          }

                          else -> result.notImplemented()
                      }
                  }
              }

              private fun hasPermission(permission: String): Boolean {
                  return Build.VERSION.SDK_INT < 23 ||
                      checkSelfPermission(permission) ==
                      PackageManager.PERMISSION_GRANTED
              }

              private fun hasConnectPermission(): Boolean {
                  return Build.VERSION.SDK_INT < Build.VERSION_CODES.S ||
                      hasPermission(Manifest.permission.BLUETOOTH_CONNECT)
              }

              private fun hasAdvertisePermission(): Boolean {
                  return Build.VERSION.SDK_INT < Build.VERSION_CODES.S ||
                      hasPermission(Manifest.permission.BLUETOOTH_ADVERTISE)
              }

              private fun isBluetoothEnabled(): Boolean {
                  if (!hasConnectPermission()) return false

                  val manager = getSystemService(
                      Context.BLUETOOTH_SERVICE
                  ) as BluetoothManager

                  return manager.adapter?.isEnabled == true
              }

              private fun startBluetoothServer() {
                  if (!hasConnectPermission() || !hasAdvertisePermission()) {
                      throw SecurityException(
                          "Bluetooth permission is required"
                      )
                  }

                  val manager = getSystemService(
                      Context.BLUETOOTH_SERVICE
                  ) as BluetoothManager

                  val adapter = manager.adapter
                      ?: throw IllegalStateException(
                          "Bluetooth is unavailable"
                      )

                  if (!adapter.isEnabled) {
                      throw IllegalStateException(
                          "প্রথমে ফোনের Bluetooth চালু করুন"
                      )
                  }

                  val bleAdvertiser = adapter.bluetoothLeAdvertiser
                      ?: throw IllegalStateException(
                          "এই ফোনে BLE advertising সমর্থিত নয়"
                      )

                  stopBluetoothServer()

                  val newCharacteristic = BluetoothGattCharacteristic(
                      CHARACTERISTIC_UUID,
                      BluetoothGattCharacteristic.PROPERTY_READ or
                          BluetoothGattCharacteristic.PROPERTY_WRITE or
                          BluetoothGattCharacteristic.PROPERTY_WRITE_NO_RESPONSE or
                          BluetoothGattCharacteristic.PROPERTY_NOTIFY,
                      BluetoothGattCharacteristic.PERMISSION_READ or
                          BluetoothGattCharacteristic.PERMISSION_WRITE
                  )

                  newCharacteristic.addDescriptor(
                      BluetoothGattDescriptor(
                          CCCD_UUID,
                          BluetoothGattDescriptor.PERMISSION_READ or
                              BluetoothGattDescriptor.PERMISSION_WRITE
                      )
                  )

                  val service = BluetoothGattService(
                      SERVICE_UUID,
                      BluetoothGattService.SERVICE_TYPE_PRIMARY
                  )

                  service.addCharacteristic(newCharacteristic)

                  characteristic = newCharacteristic

                  gattServer = manager.openGattServer(
                      this,
                      gattCallback
                  ) ?: throw IllegalStateException(
                      "GATT server চালু করা যায়নি"
                  )

                  gattServer?.addService(service)

                  advertiser = bleAdvertiser

                  val settings = AdvertiseSettings.Builder()
                      .setAdvertiseMode(
                          AdvertiseSettings.ADVERTISE_MODE_LOW_LATENCY
                      )
                      .setTxPowerLevel(
                          AdvertiseSettings.ADVERTISE_TX_POWER_MEDIUM
                      )
                      .setConnectable(true)
                      .build()

                  val data = AdvertiseData.Builder()
                      .setIncludeDeviceName(false)
                      .addServiceUuid(ParcelUuid(SERVICE_UUID))
                      .build()

                  bleAdvertiser.startAdvertising(
                      settings,
                      data,
                      advertiseCallback
                  )
              }

              private val advertiseCallback =
                  object : AdvertiseCallback() {
                      override fun onStartSuccess(
                          settingsInEffect: AdvertiseSettings?
                      ) {
                          runOnUiThread {
                              channel.invokeMethod(
                                  "advertisingStarted",
                                  null
                              )
                          }
                      }

                      override fun onStartFailure(errorCode: Int) {
                          runOnUiThread {
                              channel.invokeMethod(
                                  "bluetoothError",
                                  "Advertising failed: $errorCode"
                              )
                          }
                      }
                  }

              private val gattCallback =
                  object : BluetoothGattServerCallback() {

                      override fun onConnectionStateChange(
                          device: BluetoothDevice,
                          status: Int,
                          newState: Int
                      ) {
                          if (newState == BluetoothProfile.STATE_CONNECTED) {
                              connectedDevice = device

                              runOnUiThread {
                                  channel.invokeMethod(
                                      "deviceConnected",
                                      device.address
                                  )
                              }
                          } else if (
                              newState == BluetoothProfile.STATE_DISCONNECTED
                          ) {
                              if (connectedDevice?.address == device.address) {
                                  connectedDevice = null
                              }

                              runOnUiThread {
                                  channel.invokeMethod(
                                      "deviceDisconnected",
                                      device.address
                                  )
                              }
                          }
                      }

                      override fun onCharacteristicReadRequest(
                          device: BluetoothDevice,
                          requestId: Int,
                          offset: Int,
                          characteristic: BluetoothGattCharacteristic
                      ) {
                          val value = characteristic.value ?: byteArrayOf()

                          gattServer?.sendResponse(
                              device,
                              requestId,
                              BluetoothGatt.GATT_SUCCESS,
                              offset,
                              value
                          )
                      }

                      override fun onCharacteristicWriteRequest(
                          device: BluetoothDevice,
                          requestId: Int,
                          characteristic: BluetoothGattCharacteristic,
                          preparedWrite: Boolean,
                          responseNeeded: Boolean,
                          offset: Int,
                          value: ByteArray
                      ) {
                          if (characteristic.uuid != CHARACTERISTIC_UUID) {
                              if (responseNeeded) {
                                  gattServer?.sendResponse(
                                      device,
                                      requestId,
                                      BluetoothGatt.GATT_FAILURE,
                                      offset,
                                      null
                                  )
                              }
                              return
                          }

                          if (offset != 0) {
                              if (responseNeeded) {
                                  gattServer?.sendResponse(
                                      device,
                                      requestId,
                                      BluetoothGatt.GATT_INVALID_OFFSET,
                                      offset,
                                      null
                                  )
                              }
                              return
                          }

                          characteristic.value = value

                          if (responseNeeded) {
                              gattServer?.sendResponse(
                                  device,
                                  requestId,
                                  BluetoothGatt.GATT_SUCCESS,
                                  offset,
                                  value
                              )
                          }

                          val message = value.toString(Charsets.UTF_8)

                          runOnUiThread {
                              channel.invokeMethod(
                                  "messageReceived",
                                  message
                              )
                          }
                      }

                      override fun onDescriptorReadRequest(
                          device: BluetoothDevice,
                          requestId: Int,
                          offset: Int,
                          descriptor: BluetoothGattDescriptor
                      ) {
                          val value = descriptor.value ?: byteArrayOf(0, 0)

                          gattServer?.sendResponse(
                              device,
                              requestId,
                              BluetoothGatt.GATT_SUCCESS,
                              offset,
                              value
                          )
                      }

                      override fun onDescriptorWriteRequest(
                          device: BluetoothDevice,
                          requestId: Int,
                          descriptor: BluetoothGattDescriptor,
                          preparedWrite: Boolean,
                          responseNeeded: Boolean,
                          offset: Int,
                          value: ByteArray
                      ) {
                          if (descriptor.uuid == CCCD_UUID) {
                              descriptor.value = value

                              if (responseNeeded) {
                                  gattServer?.sendResponse(
                                      device,
                                      requestId,
                                      BluetoothGatt.GATT_SUCCESS,
                                      offset,
                                      value
                                  )
                              }
                          } else if (responseNeeded) {
                              gattServer?.sendResponse(
                                  device,
                                  requestId,
                                  BluetoothGatt.GATT_FAILURE,
                                  offset,
                                  null
                              )
                          }
                      }
                  }

              private fun sendMessage(message: String): Boolean {
                  if (!hasConnectPermission()) return false

                  val device = connectedDevice ?: return false
                  val server = gattServer ?: return false
                  val target = characteristic ?: return false

                  target.value = message.toByteArray(Charsets.UTF_8)

                  return if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      server.notifyCharacteristicChanged(
                          device,
                          target,
                          false
                      ) == BluetoothGatt.GATT_SUCCESS
                  } else {
                      @Suppress("DEPRECATION")
                      server.notifyCharacteristicChanged(
                          device,
                          target,
                          false
                      )
                  }
              }

              private fun stopBluetoothServer() {
                  if (hasConnectPermission() && hasAdvertisePermission()) {
                      try {
                          advertiser?.stopAdvertising(advertiseCallback)
                      } catch (_: Exception) {
                      }
                  }

                  advertiser = null

                  try {
                      gattServer?.close()
                  } catch (_: Exception) {
                  }

                  gattServer = null
                  connectedDevice = null
                  characteristic = null
              }

              override fun onDestroy() {
                  stopBluetoothServer()
                  super.onDestroy()
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: joruri-messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
