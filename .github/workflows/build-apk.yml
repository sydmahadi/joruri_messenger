name: Build Joruri Messenger APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Remove old Android project
        run: |
          rm -rf android

      - name: Create fresh Android project
        run: |
          flutter create . \
            --platforms=android \
            --org com.joruri

      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()

          permissions = """
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN"
                  android:usesPermissionFlags="neverForLocation" />

              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />

              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />

              <uses-permission android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />

              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />

              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"
                  android:maxSdkVersion="30" />

              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />

              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />

              <uses-permission android:name="android.permission.INTERNET" />
          """

          text = text.replace(
              '<application',
              permissions + '\n    <application',
              1
          )

          text = text.replace(
              'android:label="joruri_messenger"',
              'android:label="জরুরি মেসেঞ্জার"',
              1
          )

          manifest.write_text(text)
          PY

      - name: Create native Bluetooth MainActivity
        run: |
          mkdir -p android/app/src/main/kotlin/com/joruri/messenger

          cat > android/app/src/main/kotlin/com/joruri/messenger/MainActivity.kt <<'EOF'
          package com.joruri.messenger

          import android.Manifest
          import android.bluetooth.BluetoothGattCharacteristic
          import android.bluetooth.BluetoothGattServer
          import android.bluetooth.BluetoothGattServerCallback
          import android.bluetooth.BluetoothGattService
          import android.bluetooth.BluetoothManager
          import android.bluetooth.le.AdvertiseCallback
          import android.bluetooth.le.AdvertiseData
          import android.bluetooth.le.AdvertiseSettings
          import android.bluetooth.le.BluetoothLeAdvertiser
          import android.content.Context
          import android.content.pm.PackageManager
          import android.os.Build
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.util.UUID

          class MainActivity : FlutterActivity() {

              companion object {
                  private const val CHANNEL =
                      "joruri_messenger/bluetooth"

                  private val SERVICE_UUID =
                      UUID.fromString(
                          "0000FEE0-0000-1000-8000-00805F9B34FB"
                      )

                  private val CHARACTERISTIC_UUID =
                      UUID.fromString(
                          "0000FEE1-0000-1000-8000-00805F9B34FB"
                      )
              }

              private lateinit var channel: MethodChannel

              private var gattServer: BluetoothGattServer? = null
              private var advertiser: BluetoothLeAdvertiser? = null

              private var connectedDevice =
                  null as android.bluetooth.BluetoothDevice?

              private lateinit var characteristic:
                  BluetoothGattCharacteristic

              override fun configureFlutterEngine(
                  flutterEngine: FlutterEngine
              ) {
                  super.configureFlutterEngine(flutterEngine)

                  channel = MethodChannel(
                      flutterEngine.dartExecutor.binaryMessenger,
                      CHANNEL
                  )

                  channel.setMethodCallHandler { call, result ->

                      when (call.method) {

                          "startAdvertising" -> {
                              startAdvertising()
                              result.success(true)
                          }

                          "stopAdvertising" -> {
                              stopAdvertising()
                              result.success(true)
                          }

                          "sendMessage" -> {
                              val message =
                                  call.argument<String>("message")

                              if (
                                  message == null ||
                                  message.isEmpty()
                              ) {
                                  result.error(
                                      "INVALID_MESSAGE",
                                      "Message is empty",
                                      null
                                  )
                              } else {
                                  sendMessage(message)
                                  result.success(true)
                              }
                          }

                          else -> {
                              result.notImplemented()
                          }
                      }
                  }
              }

              private fun hasBluetoothPermission(): Boolean {

                  if (
                      Build.VERSION.SDK_INT >=
                      Build.VERSION_CODES.S
                  ) {
                      return checkSelfPermission(
                          Manifest.permission.BLUETOOTH_CONNECT
                      ) == PackageManager.PERMISSION_GRANTED &&
                      checkSelfPermission(
                          Manifest.permission.BLUETOOTH_ADVERTISE
                      ) == PackageManager.PERMISSION_GRANTED
                  }

                  return true
              }

              private fun startAdvertising() {

                  if (!hasBluetoothPermission()) {
                      channel.invokeMethod(
                          "bluetoothError",
                          "Bluetooth permission is required"
                      )
                      return
                  }

                  val manager =
                      getSystemService(
                          Context.BLUETOOTH_SERVICE
                      ) as BluetoothManager

                  val adapter = manager.adapter

                  advertiser =
                      adapter.bluetoothLeAdvertiser

                  if (advertiser == null) {
                      channel.invokeMethod(
                          "bluetoothError",
                          "BLE is not supported"
                      )
                      return
                  }

                  characteristic =
                      BluetoothGattCharacteristic(
                          CHARACTERISTIC_UUID,
                          BluetoothGattCharacteristic.PROPERTY_READ or
                              BluetoothGattCharacteristic.PROPERTY_WRITE or
                              BluetoothGattCharacteristic.PROPERTY_NOTIFY,
                          BluetoothGattCharacteristic.PERMISSION_READ or
                              BluetoothGattCharacteristic.PERMISSION_WRITE
                      )

                  val service =
                      BluetoothGattService(
                          SERVICE_UUID,
                          BluetoothGattService.SERVICE_TYPE_PRIMARY
                      )

                  service.addCharacteristic(
                      characteristic
                  )

                  gattServer =
                      manager.openGattServer(
                          this,
                          gattCallback
                      )

                  gattServer?.addService(service)

                  val settings =
                      AdvertiseSettings.Builder()
                          .setAdvertiseMode(
                              AdvertiseSettings
                                  .ADVERTISE_MODE_LOW_LATENCY
                          )
                          .setTxPowerLevel(
                              AdvertiseSettings
                                  .ADVERTISE_TX_POWER_HIGH
                          )
                          .setConnectable(true)
                          .build()

                  val data =
                      AdvertiseData.Builder()
                          .setIncludeDeviceName(true)
                          .addServiceUuid(
                              android.os.ParcelUuid(
                                  SERVICE_UUID
                              )
                          )
                          .build()

                  advertiser?.startAdvertising(
                      settings,
                      data,
                      advertiseCallback
                  )
              }

              private val advertiseCallback =
                  object : AdvertiseCallback() {

                      override fun onStartSuccess(
                          settingsInEffect:
                              AdvertiseSettings?
                      ) {
                          channel.invokeMethod(
                              "advertisingStarted",
                              null
                          )
                      }

                      override fun onStartFailure(
                          errorCode: Int
                      ) {
                          channel.invokeMethod(
                              "bluetoothError",
                              "Advertising failed: $errorCode"
                          )
                      }
                  }

              private val gattCallback =
                  object : BluetoothGattServerCallback() {

                      override fun onConnectionStateChange(
                          device:
                              android.bluetooth.BluetoothDevice?,
                          status: Int,
                          newState: Int
                      ) {

                          if (
                              newState ==
                              android.bluetooth.BluetoothProfile
                                  .STATE_CONNECTED
                          ) {
                              connectedDevice = device

                              channel.invokeMethod(
                                  "deviceConnected",
                                  device?.address
                              )
                          }

                          if (
                              newState ==
                              android.bluetooth.BluetoothProfile
                                  .STATE_DISCONNECTED
                          ) {
                              connectedDevice = null

                              channel.invokeMethod(
                                  "deviceDisconnected",
                                  device?.address
                              )
                          }
                      }

                      override fun
                          onCharacteristicWriteRequest(
                          device:
                              android.bluetooth.BluetoothDevice?,
                          requestId: Int,
                          characteristic:
                              BluetoothGattCharacteristic?,
                          preparedWrite: Boolean,
                          responseNeeded: Boolean,
                          offset: Int,
                          value: ByteArray?
                      ) {

                          if (
                              characteristic?.uuid ==
                              CHARACTERISTIC_UUID
                          ) {

                              val message =
                                  value?.toString(
                                      Charsets.UTF_8
                                  ) ?: ""

                              channel.invokeMethod(
                                  "messageReceived",
                                  message
                              )

                              if (responseNeeded) {
                                  gattServer?.sendResponse(
                                      device,
                                      requestId,
                                      android.bluetooth
                                          .BluetoothGatt
                                          .GATT_SUCCESS,
                                      offset,
                                      value
                                  )
                              }
                          }
                      }
                  }

              private fun sendMessage(
                  message: String
              ) {

                  val device = connectedDevice

                  if (device == null) {
                      channel.invokeMethod(
                          "bluetoothError",
                          "No device connected"
                      )
                      return
                  }

                  characteristic.value =
                      message.toByteArray(
                          Charsets.UTF_8
                      )

                  gattServer?.notifyCharacteristicChanged(
                      device,
                      characteristic,
                      false
                  )
              }

              private fun stopAdvertising() {

                  if (!hasBluetoothPermission()) {
                      return
                  }

                  advertiser?.stopAdvertising(
                      advertiseCallback
                  )

                  advertiser = null

                  gattServer?.close()
                  gattServer = null
                  connectedDevice = null
              }

              override fun onDestroy() {
                  stopAdvertising()
                  super.onDestroy()
              }
          }
          EOF

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: joruri-messenger-apk
          path: build/app/outputs/flutter-apk/app-release.apk
